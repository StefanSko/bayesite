<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Investigation proposal review</title>
  <style>
    body { font: 16px/1.45 system-ui, sans-serif; max-width: 72rem; margin: 2rem auto; padding: 0 1rem; color: #18212b; }
    main { display: grid; grid-template-columns: minmax(14rem, 1fr) minmax(24rem, 3fr); gap: 2rem; }
    button { width: 100%; text-align: left; margin: .25rem 0; padding: .5rem; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f4f6f8; padding: 1rem; border-radius: .3rem; }
    .notice { border: 2px solid #9b5d00; padding: .75rem; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Investigation proposals</h1>
  <p class="notice"><strong>Read-only review.</strong> Approval is not available in this browser page. Use the trusted host CLI or chat slash commands.</p>
  <main>
    <section><h2>Proposals</h2><div id="proposals">Loading…</div></section>
    <section><h2>Record</h2><pre id="record">Select a proposal.</pre></section>
  </main>
  <script type="module" src="review.js"></script>
</body>
</html>
